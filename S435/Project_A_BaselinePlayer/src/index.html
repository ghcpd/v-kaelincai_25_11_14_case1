<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Baseline Player</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    #canvas { border: 1px solid #ccc; width: 640px; height: 360px; background: #000; }
  </style>
</head>
<body>
  <h1>Baseline Player (No enhancements)</h1>
  <div>
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <span id="status">Idle</span>
  </div>
  <canvas id="canvas" width="640" height="360"></canvas>
  <div id="notes"></div>

  <script src="player.js"></script>
</body>
</html>
