<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Baseline Course Player (Project A)</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #player-container { max-width: 800px; margin: 0 auto; }
    #notes { margin-top: 12px; border: 1px solid #ddd; padding: 8px; height: 160px; overflow: auto; }
    .note { padding: 4px; border-bottom: 1px dashed #eee; }
  </style>
</head>
<body>
  <div id="player-container">
    <h2>Baseline Course Player — No enhancements</h2>
    <video id="courseVideo" width="760" height="420" controls>
      <source src="/video/720p" type="video/mp4">
      Your browser does not support the HTML5 Video tag.
    </video>
    <div id="controls">
      <!-- Baseline: No speed control, no resume, no skip -->
    </div>
    <h3>Notes</h3>
    <div id="notes"></div>
  </div>
  <script src="/static/player.js"></script>
</body>
</html>
